[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-futures-microstructure-probe"
version = "0.2.0"
description = "Probe de observacion para microestructura de Binance USD-M Futures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=15.0,<16.0",
]

[project.scripts]
microstructure-probe = "microstructure_probe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
